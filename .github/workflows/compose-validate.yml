name: package CI

# Deliberately no `paths:` filter -- unlike the per-module workflows, this one
# validates cross-module wiring (compose build contexts, doc cross-references)
# that can break even when the file that references another module didn't
# change (e.g. a module gets renamed, breaking a compose path or a doc link
# elsewhere). Runs on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml parses cleanly
        # This exact check would have caught real past bugs: RATE_LIMIT_PER_MINUTE/
        # DAILY_QUOTA_*/OPENROUTER_BASE_URL were documented as env-overridable but
        # silently weren't under docker-compose, because the variable was never
        # forwarded into a service's `environment:` block at all -- see CLAUDE.md.
        run: docker compose config

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the default (no-profile) stack via compose
        # Exercises the actual compose orchestration itself (build args, contexts,
        # service names) rather than standalone `docker build` per directory --
        # those are covered individually in each module's own CI workflow.
        run: docker compose build mtg-judge rules-mcp scryfall-mcp caddy

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check every relative markdown link resolves
        run: python3 scripts/check_markdown_links.py

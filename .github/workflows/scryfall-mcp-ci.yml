name: scryfall-mcp CI

on:
  push:
    branches: [main]
    paths:
      - "server/scryfall_mcp/**"
      - ".github/workflows/scryfall-mcp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/scryfall_mcp/**"
      - ".github/workflows/scryfall-mcp-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/scryfall_mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/scryfall_mcp/package-lock.json

      - name: Install dependencies
        # npm install, not npm ci: package-lock.json drifts from package.json
        # here (it has before) -- the same reason scryfall_mcp/Dockerfile
        # uses npm install too. npm ci hard-fails on any drift; npm install
        # tolerates and repairs it. Verified live: npm ci fails on this exact
        # repo state with "Missing: esbuild@... from lock file" et al.
        run: npm install

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        # Runs the full suite, including tests/get-card-rulings.live.test.ts,
        # which makes genuine calls to api.scryfall.com -- deliberate (see
        # CLAUDE.md's Scryfall section on why mocks alone aren't trusted for
        # that tool), but means this job can fail on Scryfall-side flakiness,
        # not just a real regression here.
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t scryfall-mcp-ci ./server/scryfall_mcp

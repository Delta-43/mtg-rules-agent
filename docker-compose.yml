networks:
  mtg-network:
    driver: bridge

services:
  mtg-judge:
    build: ./server
    container_name: mtg-judge-chatbot
    ports:
      # Loopback-only, same convention as rules-mcp/scryfall-mcp/searxng
      # below -- lets you hit the API (and its own zero-build dev test UI at
      # `/`, see app_api/main.py's serve_index()) directly without `caddy`
      # at all, e.g. `docker compose up -d --build mtg-judge rules-mcp
      # scryfall-mcp searxng`.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./server/project_config.yml:/app/project_config.yml:ro
      - ./data/conversations:/app/data/conversations
    environment:
      - PROJECT_CONFIG_FILE=/app/project_config.yml
      - CONVERSATION_DB_PATH=/app/data/conversations/conversations.db
      # A dedicated Ollama instance on the host (see scripts/run_ollama.sh),
      # not any system-wide service -- see that script for why. Only used when
      # LLM_PROVIDER=local (which includes Ollama cloud models -- inference
      # happens on Ollama's infrastructure, but the client still talks to this
      # local instance); ignored in hosted (OpenRouter) mode.
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      # Same "documented but never forwarded" gap as OPENROUTER_BASE_URL
      # below (found during the same review, not previously known): LLM_MODEL
      # wasn't in this list at all, so a .env override was silently ignored
      # under docker-compose and only project_config.yml's `models.llm` value
      # ever applied. Not int-cast, so an empty override wouldn't crash
      # config loading the way RATE_LIMIT_PER_MINUTE would -- but an empty
      # model string would still reach ChatOllama and fail confusingly at
      # first inference, so it gets the same real-default treatment as
      # OPENROUTER_BASE_URL, not an empty `:-` fallback.
      - LLM_MODEL=${LLM_MODEL:-gemma4:cloud}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Same "documented but never forwarded" gap as RATE_LIMIT_PER_MINUTE/
      # DAILY_QUOTA_* below. OPENROUTER_MODEL is fine with an empty
      # fallback ("" isn't a meaningfully different case from unset for a
      # model id string -- langchain_openai would just error clearly on an
      # empty model). OPENROUTER_BASE_URL is NOT: empty string is not the
      # same as "unset" the way it is for CORS_ALLOWED_ORIGINS/API_KEYS --
      # an empty base_url made the OpenAI SDK fall back to *its own*
      # default (api.openai.com) instead of core_config's real OpenRouter
      # default, so requests silently went to the wrong host entirely and
      # got a confusing "invalid API key" error back from OpenAI, not
      # OpenRouter. Needs the real default baked in here, same reasoning as
      # the int-cast vars below just for a different failure mode.
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - RULES_MCP_URL=http://rules-mcp:8100/mcp
      - SCRYFALL_MCP_URL=http://scryfall-mcp:3000/mcp
      - SEARXNG_URL=http://searxng:8080
      - API_KEYS=${API_KEYS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Documented in README as env-overridable, but docker-compose only
      # forwards vars explicitly listed here -- without these three, .env
      # silently had no effect on a docker-compose deployment and only
      # project_config.yml's values ever applied.
      #
      # Unlike the string/list vars above, these three are int-cast by
      # core_config/settings.py's _resolve() -- an *empty* env var (not an
      # absent one) still short-circuits straight to _coerce("", int), which
      # raises ValueError and crashes config loading at import time. So,
      # unlike CORS_ALLOWED_ORIGINS/API_KEYS's `:-` (empty is fine, parses to
      # []), these need a real numeric fallback baked in, matching
      # core_config's own hardcoded defaults exactly.
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-20}
      - DAILY_QUOTA_ANONYMOUS=${DAILY_QUOTA_ANONYMOUS:-30}
      - DAILY_QUOTA_AUTHENTICATED=${DAILY_QUOTA_AUTHENTICATED:-500}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `condition: service_healthy`, not the bare list form: the bare form only
    # waits for these containers to *start*, not for rules-mcp's HTTP server to
    # actually be listening -- and rules-mcp's own main() runs its (possibly
    # 8-10 minute, first-boot) ingestion to completion before it ever binds its
    # port. Found live: mtg-judge raced ahead on a fresh volume, tried to load
    # MCP tools from a rules-mcp that wasn't listening yet, and crash-looped
    # (UnboundLocalError inside langchain-mcp-adapters, not a clean retry)
    # until `restart: unless-stopped` happened to catch it after rules-mcp
    # finally came up -- confusing tracebacks for several minutes on every
    # fresh install, not just a cosmetic delay. depends_on's health-gating
    # only works because rules-mcp's own healthcheck below can't pass until
    # its HTTP server is actually accepting connections.
    depends_on:
      rules-mcp:
        condition: service_healthy
      scryfall-mcp:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - mtg-network
    restart: unless-stopped
    healthcheck:
      # No curl/wget in this image -- python3 (already required by the app) is
      # the only HTTP client available.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  rules-mcp:
    build: ./server/rules_mcp
    container_name: mtg-rules-mcp
    ports:
      # Loopback-only: lets a host-run backend (run_bot.sh) reach it directly
      # without publishing it to the network. Only caddy is meant to be public.
      - "127.0.0.1:8100:8100"
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/pdf_parser:/app/data/pdf_parser
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8100
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PDF_PARSER_DIR=/app/data/pdf_parser
      - REFRESH_ON_BOOT=true
      # local (default, no key needed) or hosted (OpenRouter). A separate
      # key from the main backend's OPENROUTER_API_KEY on purpose -- see
      # rules_mcp/settings.py. Only OPENROUTER_EMBEDDING_API_KEY is safe
      # with an empty `:-` fallback here -- the other two override
      # rules_mcp/settings.py's own non-empty Python defaults if given an
      # empty string instead, same lesson as OPENROUTER_BASE_URL above for
      # the chat provider. INGEST_CONCURRENCY is deliberately NOT forwarded
      # here: its Python-side default (cpu_count(), capped) already does the
      # right thing when the var is genuinely absent, and forwarding it with
      # a blind `:-` fallback would crash config loading on an empty string
      # the same way the int-cast vars below would (it's int-cast too).
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      # Same gap as LLM_MODEL on mtg-judge above (found during the same
      # review): not previously in this list at all, so a .env override of
      # the local embedding model tag was silently ignored under
      # docker-compose. Real default, not an empty `:-` fallback, for the
      # same reason as OPENROUTER_MODEL/OPENROUTER_BASE_URL above.
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-mxbai-embed-large}
      - OPENROUTER_EMBEDDING_API_KEY=${OPENROUTER_EMBEDDING_API_KEY:-}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-baai/bge-m3}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mtg-network
    restart: unless-stopped
    healthcheck:
      # No curl/wget in this image -- python3 is the only HTTP client available.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # server.py's main() runs ingestion to completion (docs: ~8-10 min for a
      # full first-boot embed) BEFORE the HTTP server binds its port at all --
      # every check fails with connection-refused until then, by design, not
      # by malfunction. start_period this long means those expected failures
      # never count toward `retries` (which would otherwise flip this
      # container to "unhealthy" after ~2 minutes and leave mtg-judge's
      # `condition: service_healthy` wait hanging on a dependency that looks
      # permanently broken instead of just still starting). A container that
      # actually is broken still surfaces correctly: `docker compose logs
      # rules-mcp` shows a real crash instead of a boring wait, and `docker
      # compose up` doesn't return control until mtg-judge is genuinely ready.
      start_period: 20m

  scryfall-mcp:
    build: ./server/scryfall_mcp
    container_name: mtg-scryfall-mcp
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=3000
      - SCRYFALL_USER_AGENT=${SCRYFALL_USER_AGENT:-MTG-Judge-Chatbot/1.0 (+https://github.com/mtg-judge)}
    networks:
      - mtg-network
    restart: unless-stopped
    healthcheck:
      # Node image, no curl/wget -- use node's own http client instead.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  searxng:
    image: searxng/searxng:latest
    container_name: mtg-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./server/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - mtg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Reverse proxy in front of mtg-judge: TLS termination + a real domain if
  # you want one. Not built from anything project-specific -- a bare
  # `caddy:2` image just proxying to mtg-judge, since mtg-judge already
  # serves its own zero-build dev test UI at `/` (app_api/main.py's
  # serve_index()) plus /chat*, /health, /metrics -- there's no separate
  # static bundle to serve here, so no build step or frontend dependency at all.
  # For pure loopback use, skip this and hit mtg-judge's own port mapping
  # above directly.
  caddy:
    image: caddy:2
    container_name: mtg-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # Loopback-only by default -- override to 0.0.0.0 in a
      # docker-compose.override.yml if you want this reachable off-host
      # (e.g. fronting it with a real domain/TLS). Remap the host side here
      # if 8877 collides with something else already running on your host.
      - "127.0.0.1:8877:80"
    depends_on:
      mtg-judge:
        condition: service_healthy
    networks:
      - mtg-network
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

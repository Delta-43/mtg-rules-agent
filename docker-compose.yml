networks:
  mtg-network:
    driver: bridge

services:
  mtg-judge:
    build: ./server
    container_name: mtg-judge-chatbot
    volumes:
      - ./server/project_config.yml:/app/project_config.yml:ro
      - ./data/conversations:/app/data/conversations
    environment:
      - PROJECT_CONFIG_FILE=/app/project_config.yml
      - CONVERSATION_DB_PATH=/app/data/conversations/conversations.db
      # A dedicated Ollama instance on the host (see scripts/run_ollama.sh),
      # not any system-wide service -- see that script for why. Only used when
      # LLM_PROVIDER=local (which includes Ollama cloud models -- inference
      # happens on Ollama's infrastructure, but the client still talks to this
      # local instance); ignored in hosted (OpenRouter) mode.
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      # Same "documented but never forwarded" gap as OPENROUTER_BASE_URL
      # below (found during the same review, not previously known): LLM_MODEL
      # wasn't in this list at all, so a .env override was silently ignored
      # under docker-compose and only project_config.yml's `models.llm` value
      # ever applied. Not int-cast, so an empty override wouldn't crash
      # config loading the way RATE_LIMIT_PER_MINUTE would -- but an empty
      # model string would still reach ChatOllama and fail confusingly at
      # first inference, so it gets the same real-default treatment as
      # OPENROUTER_BASE_URL, not an empty `:-` fallback.
      - LLM_MODEL=${LLM_MODEL:-gemma4:cloud}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Same "documented but never forwarded" gap as RATE_LIMIT_PER_MINUTE/
      # DAILY_QUOTA_* below. OPENROUTER_MODEL is fine with an empty
      # fallback ("" isn't a meaningfully different case from unset for a
      # model id string -- langchain_openai would just error clearly on an
      # empty model). OPENROUTER_BASE_URL is NOT: empty string is not the
      # same as "unset" the way it is for CORS_ALLOWED_ORIGINS/API_KEYS --
      # an empty base_url made the OpenAI SDK fall back to *its own*
      # default (api.openai.com) instead of core_config's real OpenRouter
      # default, so requests silently went to the wrong host entirely and
      # got a confusing "invalid API key" error back from OpenAI, not
      # OpenRouter. Needs the real default baked in here, same reasoning as
      # the int-cast vars below just for a different failure mode.
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - RULES_MCP_URL=http://rules-mcp:8100/mcp
      - SCRYFALL_MCP_URL=http://scryfall-mcp:3000/mcp
      - SEARXNG_URL=http://searxng:8080
      - API_KEYS=${API_KEYS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Documented in README as env-overridable, but docker-compose only
      # forwards vars explicitly listed here -- without these three, .env
      # silently had no effect on a docker-compose deployment and only
      # project_config.yml's values ever applied.
      #
      # Unlike the string/list vars above, these three are int-cast by
      # core_config/settings.py's _resolve() -- an *empty* env var (not an
      # absent one) still short-circuits straight to _coerce("", int), which
      # raises ValueError and crashes config loading at import time. So,
      # unlike CORS_ALLOWED_ORIGINS/API_KEYS's `:-` (empty is fine, parses to
      # []), these need a real numeric fallback baked in, matching
      # core_config's own hardcoded defaults exactly.
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-20}
      - DAILY_QUOTA_ANONYMOUS=${DAILY_QUOTA_ANONYMOUS:-30}
      - DAILY_QUOTA_AUTHENTICATED=${DAILY_QUOTA_AUTHENTICATED:-500}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rules-mcp
      - scryfall-mcp
      - searxng
    networks:
      - mtg-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  rules-mcp:
    build: ./server/rules_mcp
    container_name: mtg-rules-mcp
    ports:
      # Loopback-only: lets a host-run backend (run_bot.sh) reach it directly
      # without publishing it to the network. Only caddy is meant to be public.
      - "127.0.0.1:8100:8100"
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/pdf_parser:/app/data/pdf_parser
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8100
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PDF_PARSER_DIR=/app/data/pdf_parser
      - REFRESH_ON_BOOT=true
      # local (default, no key needed) or hosted (OpenRouter). A separate
      # key from the main backend's OPENROUTER_API_KEY on purpose -- see
      # rules_mcp/settings.py. Only OPENROUTER_EMBEDDING_API_KEY is safe
      # with an empty `:-` fallback here -- the other two override
      # rules_mcp/settings.py's own non-empty Python defaults if given an
      # empty string instead, same lesson as OPENROUTER_BASE_URL above for
      # the chat provider. INGEST_CONCURRENCY is deliberately NOT forwarded
      # here: its Python-side default (cpu_count(), capped) already does the
      # right thing when the var is genuinely absent, and forwarding it with
      # a blind `:-` fallback would crash config loading on an empty string
      # the same way the int-cast vars below would (it's int-cast too).
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      # Same gap as LLM_MODEL on mtg-judge above (found during the same
      # review): not previously in this list at all, so a .env override of
      # the local embedding model tag was silently ignored under
      # docker-compose. Real default, not an empty `:-` fallback, for the
      # same reason as OPENROUTER_MODEL/OPENROUTER_BASE_URL above.
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-mxbai-embed-large}
      - OPENROUTER_EMBEDDING_API_KEY=${OPENROUTER_EMBEDDING_API_KEY:-}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-baai/bge-m3}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mtg-network
    restart: unless-stopped

  scryfall-mcp:
    build: ./server/scryfall_mcp
    container_name: mtg-scryfall-mcp
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=3000
      - SCRYFALL_USER_AGENT=${SCRYFALL_USER_AGENT:-MTG-Judge-Chatbot/1.0 (+https://github.com/mtg-judge)}
    networks:
      - mtg-network
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: mtg-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./server/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - mtg-network
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: webapp/Dockerfile
      args:
        # Same-origin deploy (default): Caddy serves the built PWA and
        # proxies /chat*, /health on the same domain, so the API base is
        # relative. Override if the frontend is ever split onto a
        # different origin than the backend.
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: mtg-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mtg-judge
    networks:
      - mtg-network
    restart: unless-stopped

  # Opt-in: `docker-compose --profile monitoring up`. Prometheus scraping
  # mtg-judge's and (when the `discord` profile is also active)
  # discord-bot's /metrics endpoints, plus the SLO recording rules/alert in
  # ops/monitoring/prometheus/rules/. See docs/OBSERVABILITY_PLAN_V2.md.
  # No extra_hosts/host.docker.internal needed -- both scrape targets are
  # reachable by Docker-internal DNS on mtg-network.
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: mtg-prometheus
    # Overrides the image's default CMD entirely, so every default flag
    # needs to be re-listed, not just retention (confirmed via `docker
    # inspect prom/prometheus:v2.50.0` before adding this). Retention
    # matters here specifically: the image's own built-in default is 15d
    # when --storage.tsdb.retention.time is omitted, but
    # ops/monitoring/prometheus/rules/slo_rules.yml's
    # job:http_availability:ratio_rate30d rule computes rate(...[30d]) --
    # at 15d retention that range can never span more than 15 days of
    # actual samples, so the "30-day" availability SLI would silently
    # reflect a ~15-day window instead (half the ~3.6h/30-day error budget
    # docs/OBSERVABILITY_PLAN_V2.md documents for this SLO). 31d, not 30d,
    # for a one-day margin against the exact boundary.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=31d"
    volumes:
      - ./ops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - mtg-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Opt-in: `docker-compose --profile tunnel up`. Connects this deployment to
  # a Cloudflare Tunnel so it's reachable at your domain (e.g.
  # azor.delta43.net) with TLS terminated at Cloudflare's edge -- no public
  # port needs to be open on the host at all. Create the tunnel in the
  # Cloudflare Zero Trust dashboard, point its public hostname at
  # `http://localhost:80` (host networking, see below -- matches this
  # deployment's other cloudflared tunnels), and put the tunnel's token in
  # CLOUDFLARE_TUNNEL_TOKEN.
  #
  # Pinned by digest + host networking + pull_policy: always to match this
  # host's other cloudflared tunnels (~/.docker_configs/cloudflared/compose.yml)
  # -- one cloudflared version across every tunnel on the box. Unlike those,
  # the token here is an env var, not inlined in the command: this file is
  # published on GitHub, theirs isn't.
  cloudflared:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: cf-oracle-tunnel
    network_mode: host
    pull_policy: always
    # Not `:?`-required: compose interpolates every service's command/env at
    # parse time regardless of active --profile flags (see the r2-backup
    # service below), so a hard requirement here would break plain
    # `docker-compose up` for everyone not using the tunnel profile.
    # cloudflared fails fast with its own clear error if this is empty.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped
    profiles:
      - tunnel

  # Opt-in: `docker-compose --profile backup up`. Periodically snapshots
  # conversation memory + the rules ChromaDB index to Cloudflare R2 (an
  # S3-compatible bucket) so state survives a VPS rebuild/redeploy. No-ops
  # (logs and exits) if R2_* credentials aren't set -- see ops/README.md and
  # ops/backup_to_r2.py. Builds from ops/ (its own small boto3-only image),
  # not the main backend image -- this service has zero application imports.
  r2-backup:
    build: ./ops
    container_name: mtg-r2-backup
    volumes:
      - ./data/conversations:/app/data/conversations:ro
      - ./data/chroma:/app/data/chroma:ro
    environment:
      # Not `:?`-required (see the `tunnel` service's comment above) --
      # ops/backup_to_r2.py already no-ops with a clear log line if these
      # are unset, which is the right place to enforce this, not compose-parse
      # time.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_BACKUP_INTERVAL_SECONDS=${R2_BACKUP_INTERVAL_SECONDS:-3600}
    networks:
      - mtg-network
    restart: unless-stopped
    profiles:
      - backup

  # Opt-in: `docker-compose --profile discord up`. Deliberately points at the
  # public API_BASE_URL (azor.delta43.net), not an internal service name --
  # this bot is meant to work the same way whether it's colocated on this
  # host or run elsewhere entirely, and shouldn't depend on Docker-internal
  # DNS. For that reason it's also NOT attached to mtg-network -- it only
  # ever needs outbound internet access to Discord's gateway and to the
  # public API, same as any other client. See discord_client/README.md.
  discord-bot:
    build: ./discord_client
    container_name: mtg-discord-bot
    environment:
      # Not `:?`-required (see the `tunnel` service's comment above) --
      # compose interpolates every service's env at parse time regardless of
      # active --profile flags, so a hard requirement here would break plain
      # `docker-compose up` for everyone not using the discord profile.
      # bot.py's own main() already fails fast with a clear error if this is
      # empty when the container actually starts.
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - API_BASE_URL=${DISCORD_API_BASE_URL:-https://azor.delta43.net}
      # Dedicated key (not shared with anything else) so this bot's usage is
      # tracked against its own daily quota -- see root CLAUDE.md/docs/TODO.md.
      - API_KEY=${DISCORD_API_KEY:-}
      - ALLOWED_GUILD_IDS=${DISCORD_ALLOWED_GUILD_IDS:-}
      - ALLOWED_CHANNEL_IDS=${DISCORD_ALLOWED_CHANNEL_IDS:-}
      - COOLDOWN_SECONDS=${DISCORD_COOLDOWN_SECONDS:-10}
    restart: unless-stopped
    # Added for Prometheus scraping only (see ops/monitoring/prometheus/prometheus.yml)
    # -- the bot's actual API calls still go to the public API_BASE_URL
    # above, unchanged, so this doesn't reintroduce a Docker-DNS dependency
    # for anything functional, only for metrics when colocated on this host.
    # A deliberate, narrow exception to this service's "not on mtg-network"
    # design (see root CLAUDE.md) -- see docs/OBSERVABILITY_PLAN_V2.md
    # section 1.3/5 for the reasoning and the open question for whoever owns
    # that original decision.
    networks:
      - mtg-network
    profiles:
      - discord

  # Opt-in: `docker-compose --profile accounts up`. Scaffolding for the
  # future accounts/tiers/billing pivot (see docs/PLAN.md, accounts_db/README.md)
  # -- self-hosted Supabase, trimmed to just these two containers.
  # Deliberately NOT running PostgREST/Realtime/Storage/Kong/Studio/
  # analytics from the official bundle -- FastAPI talks to Postgres
  # directly (accounts_db/) and verifies GoTrue-issued JWTs locally, so
  # none of Supabase's REST/gateway layer is needed. Not added to
  # `mtg-judge`'s `depends_on`, and nothing here is forwarded into
  # `mtg-judge`'s environment yet -- that's Phase 1 work, once
  # ACCOUNTS_MODE=hosted is something the backend actually branches on.
  supabase-db:
    image: supabase/postgres:17.6.1.136
    container_name: mtg-supabase-db
    environment:
      # Not `:?`-required (see the `tunnel` service's comment above) --
      # the image itself fails fast with its own clear error on an empty
      # required value at container start, same reasoning as
      # DISCORD_BOT_TOKEN/CLOUDFLARE_TUNNEL_TOKEN.
      - POSTGRES_USER=${POSTGRES_USER:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - mtg-network
    restart: unless-stopped
    profiles:
      - accounts

  supabase-auth:
    image: supabase/gotrue:v2.189.0
    container_name: mtg-supabase-auth
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=${GOTRUE_DB_DATABASE_URL:-}
      - GOTRUE_SITE_URL=${GOTRUE_SITE_URL:-https://azor.delta43.net}
      - GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET:-}
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_DISABLE_SIGNUP=false
      # OAuth-only login (no self-hosted password storage/reset flow) --
      # see docs/PLAN.md's auth decision.
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=false
      - GOTRUE_EXTERNAL_GOOGLE_ENABLED=${OAUTH_GOOGLE_CLIENT_ID:+true}
      - GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - GOTRUE_EXTERNAL_GOOGLE_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - GOTRUE_EXTERNAL_DISCORD_ENABLED=${OAUTH_DISCORD_CLIENT_ID:+true}
      - GOTRUE_EXTERNAL_DISCORD_CLIENT_ID=${OAUTH_DISCORD_CLIENT_ID:-}
      - GOTRUE_EXTERNAL_DISCORD_SECRET=${OAUTH_DISCORD_CLIENT_SECRET:-}
      - GOTRUE_EXTERNAL_GITHUB_ENABLED=${OAUTH_GITHUB_CLIENT_ID:+true}
      - GOTRUE_EXTERNAL_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - GOTRUE_EXTERNAL_GITHUB_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:9999:9999"
    depends_on:
      - supabase-db
    networks:
      - mtg-network
    restart: unless-stopped
    profiles:
      - accounts

volumes:
  caddy_data:
  caddy_config:
  supabase_db_data:
  prometheus_data:

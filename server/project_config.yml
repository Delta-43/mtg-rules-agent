ollama:
  base_url: http://localhost:11435

models:
  # Ollama cloud model -- inference runs on Ollama's infrastructure, not this
  # host. Requires `ollama signin` once per machine (see README). Override
  # with a real local weights tag for genuinely offline/local inference
  # (build_chat_model() logs a warning at startup if this is still a
  # ":cloud" tag with LLM_PROVIDER=local, so this isn't a silent surprise).
  #
  # No `embedding` key here -- the embedding model is rules-mcp's own
  # concern (a separate service, self-contained by design -- see root
  # CLAUDE.md). Set it via that service's own EMBEDDING_MODEL env var (see
  # server/rules_mcp/README.md), not here; a duplicate copy used to live in
  # this file too, but nothing ever actually read it for embedding
  # behavior -- only setup.sh's `ollama pull` step did, and only by
  # coincidence of a matching default.
  llm: gemma4:cloud

llm:
  reasoning: false
  num_predict: 2048
  num_ctx: 8192

# Pluggable LLM provider: "local" (Ollama, above) or "hosted" (OpenRouter).
llm_provider:
  provider: local
  # openrouter_api_key: set via OPENROUTER_API_KEY env var instead of committing it here
  openrouter_model: openrouter/auto
  openrouter_base_url: https://openrouter.ai/api/v1

# MCP tool servers the agent talks to. The docker-compose defaults point at the
# in-network service names; these are the equivalents for running everything
# on the host without Docker.
mcp:
  rules_url: http://localhost:8100/mcp
  scryfall_url: http://localhost:3000/mcp

web_search:
  searxng_url: http://localhost:8080
  max_results: 5
  fetch_top_n: 3

server:
  host: 0.0.0.0
  port: 8000
  # Comma-separated allowlist of origins for the web UI (empty = CORS disabled).
  cors_allowed_origins: ""
  # Comma-separated API keys for X-API-Key auth (empty = auth disabled, local dev).
  # A request with no X-API-Key header at all is still allowed through (the
  # anonymous tier -- e.g. a browser-based client that can't keep a key
  # secret) -- this list only validates keys that ARE presented.
  api_keys: ""
  rate_limit_per_minute: 20
  # Daily request quota, tiered by whether the caller presented a valid API key.
  # A cost ceiling against sustained abuse, not a precise billing mechanism.
  daily_quota_anonymous: 30
  daily_quota_authenticated: 500

conversation:
  # SQLite-backed LangGraph checkpointer for multi-turn memory, keyed by
  # conversation_id. Host-relative default for the hybrid dev workflow;
  # docker-compose overrides this to an absolute in-container bind-mount path.
  db_path: data/conversations/conversations.db

logging:
  level: INFO
